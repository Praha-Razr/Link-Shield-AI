services:
  - type: web
    name: linkshield-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: AUTO_LOAD_DEMO_DATA
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: AI_ASSIST_ANALYSIS
        value: "true"
      - key: ALLOW_EXTERNAL_AI_FOR_REAL_CASES
        value: "false"
